# This workflow builds and deploys the Jekyll site to GitHub Pages.
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main # Set a branch to deploy from (e.g., main, master, gh-pages)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for jekyll/builder

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.x' # Use a recent Ruby version compatible with Jekyll
          bundler-cache: true # Install dependencies with bundler

      - name: Build Jekyll site
        uses: jekyll/builder@v1
        with:
          source: ./
          destination: ./_site
          # You can add additional Jekyll build options here if needed, e.g.,
          # args: --verbose

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4